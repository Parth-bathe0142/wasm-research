<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            button.running {
                background-color: #688888;
            }
        </style>
    </head>
    <body>
        <table border="1">
            <tr>
                <th>Test</th>
                <th>Runs</th>
                <th>Params</th>
                <th>Native</th>
                <th>Single</th>
                <th>Multi</th>
                <th>Actions</th>
            </tr>
            <tr>
                <td>Sum of 1B</td>
                <td><input type="number" id="sum-runs" value="20" /></td>
                <td></td>
                <td><span id="sum-native"></span></td>
                <td><span id="sum-single"></span></td>
                <td><span id="sum-multi"></span></td>
                <td>
                    <button class="test-warmup" id="sum-warmup">Warm up</button>
                    <button class="test-runner" id="sum-runner">Run</button>
                    <button class="test-plotter" id="sum-plotter">Plot</button>
                    <button class="test-deleter" id="sum-deleter">
                        Delete
                    </button>
                </td>
            </tr>
            <tr>
                <td>Matrix multiplication</td>
                <td><input type="number" id="matrix-runs" value="20" /></td>
                <td><input type="number" id="matrix-params" value="200" /></td>
                <td><span id="matrix-native"></span></td>
                <td><span id="matrix-single"></span></td>
                <td><span id="matrix-multi"></span></td>
                <td>
                    <button class="test-warmup" id="matrix-warmup">

                <td><input type="number" id="image-params" value="200" /></td>
                <td><span id="image-native"></span></td>
                <td><span id="image-single"></span></td>
                <td><span id="image-multi"></span></td>
                <td>
                    <button class="test-warmup" id="image-warmup">
                        Warm up
                    </button>
                    <button class="test-runner" id="image-runner">Run</button>
                    <button class="test-plotter" id="image-plotter">
                        Plot
                    </button>
                    <button class="test-deleter" id="image-deleter">

                <td><span id="grep-native"></span></td>
                <td><span id="grep-single"></span></td>
                <td><span id="grep-multi"></span></td>

                    <button class="test-warmup" id="grep-warmup">
                        Warm up

                    <button class="test-runner" id="grep-runner">Run</button>
                    <button class="test-plotter" id="grep-plotter">Plot</button>
                    <button class="test-deleter" id="grep-deleter">
                        Delete
                    </button>
                </td>
            </tr>
            <tr>
                <td>Sort Array</td>
                <td><input type="number" id="sort-runs" value="20" /></td>
                <td><input type="number" id="sort-params" value="200" /></td>
                <td><span id="sort-native"></span></td>
                <td><span id="sort-single"></span></td>
                <td><span id="sort-multi"></span></td>

                    <button class="test-warmup" id="sort-warmup">

                    <button class="test-plotter" id="sort-plotter">Plot</button>
                    <button class="test-deleter" id="sort-deleter">

                    </button>

                <td>Correlation</td>

                    <input type="number" id="correlation-runs" value="20" />

                <td>
                    <input type="number" id="correlation-params" value="200" />
                </td>

                <td><span id="correlation-single"></span></td>
                <td><span id="correlation-multi"></span></td>

                    <button class="test-warmup" id="correlation-warmup">

                    <button class="test-deleter" id="correlation-deleter">

                    </button>

        <div>
            <button type="button" id="clear-saved">Clear Saved</button
            >&nbsp;&nbsp; Browser: <span id="browser-name"></span>
        </div>

        <div style="height: 700px; width: 700px">
            <canvas id="Chart" height="500" width="500"></canvas>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" async></script>
    <script type="module" src="util.js"></script>
    <script type="module" src="results.js"></script>
    <script type="module" src="native_impl.js"></script>
    <script type="module" src="tests.js"></script>
    <script type="module" src="index.js"></script>
</html>
