<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            button.running {
                background-color: #688888;
            }
            
            #report-container {
                padding: 1px;
                border: solid black 1px;
            }
            
            #report-table {
                border-collapse: collapse;
                width: 100%;
                font-family: "Times New Roman", Times, serif;
                font-size: 12px;
                table-layout: fixed;
            }

            #report-table th,
            #report-table td {
                border: 1px solid #000;
                padding: 6px 8px;
                text-align: center;
                vertical-align: middle;
                word-wrap: break-word;
            }

            #report-table th {
                font-weight: bold;
                background-color: #e5e5e5;
            }

            #report-table tr:nth-child(even) {
                background-color: #f4f4f4;
            }

            #report-table td {
                line-height: 1.3;
            }

            #report-table td:first-child,
            #report-table th:first-child {
                font-weight: bold;
                text-align: left;
            }
            
            #report-table th {
                font-size: 11px;
            }

            .table-container {
                overflow-x: auto;
            }
        </style>
    </head>
    <body>
        <table border="1">
            <tr>
                <th>Test</th>
                <th>Runs</th>
                <th>Params</th>
                <th>Native</th>
                <th>Single</th>
                <th>Multi</th>
                <th>Actions</th>
            </tr>
            <tr>
                <td>Sum of 1B</td>
                <td><input type="number" id="sum-runs" value="20" /></td>
                <td></td>
                <td><span id="sum-native"></span></td>
                <td><span id="sum-single"></span></td>
                <td><span id="sum-multi"></span></td>
                <td>
                    <button class="test-warmup" id="sum-warmup">Warm up</button>
                    <button class="test-runner" id="sum-runner">Run</button>
                    <button class="test-plotter" id="sum-plotter">Plot</button>
                    <button class="test-deleter" id="sum-deleter">
                        Delete
                    </button>
                    <button class="test-automation" id="sum-automation">
                        Automate
                    </button>
                </td>
            </tr>
            <tr>
                <td>Matrix multiplication</td>
                <td><input type="number" id="matrix-runs" value="20" /></td>
                <td><input type="number" id="matrix-params" value="200" /></td>

                <td><span id="matrix-single"></span></td>

                        Delete
                    </button>
                    <button class="test-automation" id="matrix-automation">
                        Automate

                </td>
            </tr>
            <tr>

                <td><input type="number" id="image-runs" value="20" /></td>
                <td><input type="number" id="image-params" value="200" /></td>
                <td><span id="image-native"></span></td>
                <td><span id="image-single"></span></td>
                <td><span id="image-multi"></span></td>
                <td>
                    <button class="test-warmup" id="image-warmup">

                    <button class="test-plotter" id="image-plotter">
                        Plot
                    </button>
                    <button class="test-deleter" id="image-deleter">
                        Delete
                    </button>
                    <button class="test-automation" id="image-automation">
                        Automate

            </tr>
            <tr>
                <td>Grep</td>
                <td><input type="number" id="grep-runs" value="20" /></td>
                <td><input type="number" id="grep-params" value="200" /></td>
                <td><span id="grep-native"></span></td>
                <td><span id="grep-single"></span></td>
                <td><span id="grep-multi"></span></td>
                <td>
                    <button class="test-warmup" id="grep-warmup">
                        Warm up
                    </button>
                    <button class="test-runner" id="grep-runner">Run</button>
                    <button class="test-plotter" id="grep-plotter">Plot</button>

                        Delete
                    </button>
                    <button class="test-automation" id="grep-automation">

                    </button>
                </td>
            </tr>
            <tr>
                <td>Sort Array</td>

                <td><input type="number" id="sort-params" value="200" /></td>

                    <button class="test-plotter" id="sort-plotter">Plot</button>
                    <button class="test-deleter" id="sort-deleter">
                        Delete
                    </button>
                    <button class="test-automation" id="sort-automation">
                        Automate
                    </button>
                </td>
            </tr>
            <tr>
                <td>Correlation</td>
                <td>
                    <input type="number" id="correlation-runs" value="20" />
                </td>
                <td>
                    <input type="number" id="correlation-params" value="200" />
                </td>
                <td><span id="correlation-native"></span></td>
                <td><span id="correlation-single"></span></td>
                <td><span id="correlation-multi"></span></td>
                <td>
                    <button class="test-warmup" id="correlation-warmup">
                        Warm up
                    </button>
                    <button class="test-runner" id="correlation-runner">
                        Run
                    </button>
                    <button class="test-plotter" id="correlation-plotter">

                    </button>
                    <button class="test-deleter" id="correlation-deleter">

                    </button>
                    <button class="test-automation" id="correlation-automation">
                        Automate
                    </button>
                </td>
            </tr>
        </table>
        <div>
            <button type="button" id="clear-saved">Clear Saved</button
            >&nbsp;&nbsp; Browser: <span id="browser-name"></span>
        </div>
        <div id="report">
            <button id="generate-report">Generate Reports</button>
        </div>
        <div id="automation">
            <button id="run-automation">Run Automation</button>
        </div>

        <div style="height: 700px; width: 700px">
            <canvas id="Chart" height="500" width="500"></canvas>
        </div>
        <div id="report-container"></div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/chart.js" async></script>
    <script type="module" src="util.js"></script>
    <script type="module" src="results.js"></script>
    <script type="module" src="native_impl.js"></script>
    <script type="module" src="tests.js"></script>
    <script type="module" src="index.js"></script>
</html>
